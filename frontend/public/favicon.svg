<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="walletBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Subtle Inner Shadow / Highlight -->
    <linearGradient id="walletHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#walletBg)" />
  <rect width="512" height="512" rx="120" fill="url(#walletHighlight)" />

  <!-- Wallet Body Shape -->
  <!-- Top Flap & Main Pocket (Icon aligned centrally) -->
  <g transform="translate(96, 116)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Wallet Boundary -->
    <path 
      d="M32 40 C32 22.327 46.327 8 64 8 L256 8 C273.673 8 288 22.327 288 40 L288 64 L32 64 Z" 
      fill="#ffffff" 
      fill-opacity="0.18" 
      stroke="#ffffff" 
      stroke-width="24"
    />
    
    <!-- Main Body Base -->
    <rect 
      x="16" 
      y="64" 
      width="288" 
      height="200" 
      rx="32" 
      fill="#ffffff" 
      fill-opacity="0.12" 
      stroke="#ffffff" 
      stroke-width="24"
    />

    <!-- Clasp Pocket Tab -->
    <path 
      d="M208 124 L288 124 C299.046 124 308 132.954 308 144 L308 184 C308 195.046 299.046 204 288 204 L208 204 C196.954 204 188 195.046 188 184 L188 144 C188 132.954 196.954 124 208 124 Z" 
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="20"
    />

    <!-- Clasp Center Dot / Coin Notch -->
    <circle 
      cx="248" 
      cy="164" 
      r="16" 
      fill="#059669" 
    />
  </g>
</svg>