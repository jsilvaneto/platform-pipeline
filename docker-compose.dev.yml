services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet_backend_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - wallet_dev_data:/app/data
    environment:
      - SECRET_KEY=wallet_super_secret_local_key_2026_change_if_needed
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - wallet_dev_network

  frontend:
    image: node:20-alpine
    container_name: wallet_frontend_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - backend
    networks:
      - wallet_dev_network

volumes:
  wallet_dev_data:
    name: wallet_dev_data

networks:
  wallet_dev_network:
    name: wallet_dev_network
    driver: bridge
